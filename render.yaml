services:
  - type: web
    name: luckey3d-expert-0901
    runtime: python
    plan: free
    region: singapore
    buildCommand: python3 -m compileall server
    startCommand: python3 server/expert_gateway.py
    healthCheckPath: /api/expert/health
    autoDeployTrigger: commit
    envVars:
      - key: OPENCODE_GO_API_KEY
        sync: false
      - key: EXPERT_GATEWAY_ACCESS_TOKEN
        sync: false
      - key: OPENCODE_GO_BASE_URL
        value: https://opencode.ai/zen/go/v1
      - key: OPENCODE_GO_MODEL
        value: glm-5.3-flash
      - key: ALLOWED_ORIGINS
        value: https://shadowaabb02-spec.github.io
      - key: REQUIRE_ORIGIN
        value: "true"
      - key: EXPERT_GATEWAY_MODE
        value: cloud_demo
      - key: EXPERT_RATE_LIMIT_PER_MINUTE
        value: "12"
