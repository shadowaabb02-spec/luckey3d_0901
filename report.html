    <style>
        /* 💥 报表页专属核心样式（内嵌在此，防止跨文件粘贴丢失导致白屏） 💥 */
        .report-tabs-container { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid rgba(0, 243, 255, 0.2); padding-bottom: 10px; }
        .report-tab { background: transparent; border: 1px solid rgba(0, 243, 255, 0.3); color: #8898aa; padding: 8px 20px; font-size: 14px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        .report-tab.active, .report-tab:hover { background: rgba(0, 243, 255, 0.2); color: #00f3ff; border-color: #00f3ff; box-shadow: 0 0 10px rgba(0, 243, 255, 0.2) inset; }
        
        /* 4x2 八宫格布局设置 */
        .report-charts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 15px; }
        .chart-container, .scroll-table { height: 180px; width: 100%; }
        .scroll-table { overflow-y: auto; }
        .scroll-table::-webkit-scrollbar { width: 4px; }
        .scroll-table::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.3); border-radius: 2px; }

        .toggle-view-btn { background: rgba(255, 235, 59, 0.05); border: 1px solid rgba(255, 235, 59, 0.5); color: #ffeb3b; padding: 3px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        .toggle-view-btn:hover { background: rgba(255, 235, 59, 0.2); }

        /* 紧凑型数据表 */
        .tech-table.compact th, .tech-table.compact td { padding: 4px 6px !important; font-size: 11px !important; }

        /* 配置按钮和弹窗网格 */
        .global-config-btn { background: rgba(0, 243, 255, 0.1); border: 1px solid #00f3ff; color: #00f3ff; padding: 6px 15px; font-size: 13px; border-radius: 4px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .global-config-btn:hover { background: rgba(0, 243, 255, 0.3); box-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }
        .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 250px; overflow-y: auto; padding: 10px; background: rgba(0, 243, 255, 0.05); border-radius: 4px; margin-bottom: 15px; text-align: left; }
        .checkbox-grid::-webkit-scrollbar { width: 4px; }
        .checkbox-grid::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.3); border-radius: 2px; }

        /* 新增查看报表页卡片系统 */
        .report-type-cards { display: flex; gap: 15px; width: 100%; margin-bottom: 15px;}
        .type-card { flex: 1; background: rgba(0, 243, 255, 0.05); border: 1px solid rgba(0, 243, 255, 0.2); border-radius: 6px; padding: 15px 20px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.3s; }
        .type-card:hover { background: rgba(0, 243, 255, 0.1); transform: translateY(-2px); }
        .type-card.active { background: rgba(0, 243, 255, 0.15); border-color: #00f3ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3) inset; }
        .type-card .card-icon { font-size: 24px; }
        .type-card .card-text { font-size: 16px; font-weight: bold; color: #b0c4de; transition: 0.3s; }
        .type-card.active .card-text { color: #fff; text-shadow: 0 0 5px #00f3ff; }

        .report-control-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 15px; }
        .filter-group { display: flex; align-items: center; gap: 10px; color: #8898aa; font-size: 14px; }
        .filter-group input[type="date"] { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(0, 243, 255, 0.3); color: #fff; border-radius: 4px; color-scheme: dark; }
        
        /* 兜底布局样式：确保面板可见 */
        .report-box { background: rgba(10, 25, 50, 0.6); border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 8px; padding: 10px; box-shadow: 0 0 15px rgba(0, 243, 255, 0.1) inset; backdrop-filter: blur(8px); display: flex; flex-direction: column; }
        .box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 5px; }
    </style>

    <script>
        if (typeof echarts === 'undefined') console.error("图表库加载失败！");

        // ═══ 时间筛选 ═══
        let filterDate = '2026-05-08';
        let filterHour = 0;
        let dateLabels = [];
        let hourlyData = {};

        function initTimePicker() {
            const hourSel = document.getElementById('time-start-hour');
            for (let h = 0; h < 24; h++) hourSel.innerHTML += `<option value="${h}" ${h===0?'selected':''}>${String(h).padStart(2,'0')}:00</option>`;
        }
        initTimePicker();

        function generateTimeLabels() {
            const d = new Date(filterDate);
            d.setHours(filterHour, 0, 0, 0);
            dateLabels = [];
            hourlyData = {};
            for (let day = 0; day < 7; day++) {
                const dd = new Date(d.getTime() + day * 86400000);
                const label = `${String(dd.getMonth()+1).padStart(2,'0')}-${String(dd.getDate()).padStart(2,'0')}`;
                dateLabels.push(label);
                hourlyData[label] = [];
            }
        }

        window.onTimeFilterChange = function() {
            filterDate = document.getElementById('time-start-date').value;
            filterHour = parseInt(document.getElementById('time-start-hour').value);
            generateTimeLabels();
            refreshAllBoxes();
        };

        function randData(base, wave) { return +(base + (Math.random() * wave - wave/2)).toFixed(2); }
        function genMetricData(base, wave) {
            const res = [];
            for (let day = 0; day < 7; day++) {
                const dayData = [];
                for (let h = 0; h < 24; h++) dayData.push(randData(base, wave));
                res.push(dayData);
            }
            return res;
        }

        // ═══ Box 类型映射 (boxId → metric key + AI chart type) ═══
        const boxTypeMap = {
            box1: { key: 'composite', aiType: 'gauge_ring' },
            box2: { key: 'uf_tmp',     aiType: 'boxplot' },
            box3: { key: 'ro_cond',    aiType: 'bar_compare' },
            box4: { key: 'raw_level',  aiType: 'area_fill' },
            box5: { key: 'ro_ph',      aiType: 'scatter' },
            box6: { key: 'turbidity1', aiType: 'dual_axis' },
            box7: { key: 'cl2',        aiType: 'histogram' },
            box8: { key: 'pump_freq',  aiType: 'funnel' }
        };

        const dates = ['05-08', '05-09', '05-10', '05-11', '05-12', '05-13', '05-14'];
        const fullHourLabels = [];
        for (let d = 0; d < 7; d++) {
            const label = dates[d];
            for (let h = 0; h < 24; h++) {
                fullHourLabels.push(`${label} ${String(h).padStart(2,'0')}:00`);
            }
        }

        const genData7 = (base, wave) => Array.from({length: 7}, () => (base + (Math.random() * wave - wave/2)).toFixed(2));

        const metricsDict = {
            'uf_tmp':     { name: '超滤膜 跨膜压差 (MPa)', data: [0.05,0.06,0.07,0.08,0.09,0.08,0.08], color: '#ff4d4f', base: 0.07, wave: 0.04 },
            'ro_cond':    { name: '反渗透 产水电导率 (μS/cm)', data: [12.5,12.8,13.0,13.2,13.5,13.4,13.8], color: '#00f3ff', base: 13.2, wave: 2 },
            'raw_level':  { name: '01 原水箱 液位 (m)', data: genData7(2.5,0.5), color: '#00fa9a', base: 2.5, wave: 0.5 },
            'ro_ph':      { name: '反渗透 进水pH计 (A)', data: genData7(7.2,0.2), color: '#ffeb3b', base: 7.2, wave: 0.4 },

        function buildReportData() {
            const type = currentReportType;
            let rows, timeLabel, labels = [], timeStrs = [];
            if (type === 'daily') { rows = 24; timeLabel = '时间段 (小时)'; for (let i = 1; i <= 24; i++) { labels.push(i); timeStrs.push(`${String(i-1).padStart(2,'0')}:00 - ${String(i).padStart(2,'0')}:00`); } }
            else if (type === 'weekly') { rows = 7; timeLabel = '日期 (星期)'; const w = ['一','二','三','四','五','六','日']; for (let i = 1; i <= 7; i++) { labels.push('星期' + w[i-1]); timeStrs.push('星期' + w[i-1]); } }
            else if (type === 'monthly') { rows = 30; timeLabel = '日期 (号)'; for (let i = 1; i <= 30; i++) { labels.push(i); timeStrs.push(`本月 ${i} 日`); } }
            else if (type === 'quarterly') { rows = 3; timeLabel = '月度汇总'; labels = ['第1个月', '第2个月', '第3个月']; timeStrs = labels.slice(); }
            else { rows = 12; timeLabel = '月份 (自然月)'; for (let i = 1; i <= 12; i++) { labels.push(i + '月'); timeStrs.push(i + '月'); } }

            const scale = type === 'daily' ? 1 : (type === 'weekly' ? 24 : (type === 'monthly' ? 24 : (type === 'quarterly' ? 720 : 240)));
            const data = [];
            for (let i = 0; i < rows; i++) {
                const inFlow = +(100 * scale + Math.random() * 20 * scale).toFixed(1);
                const outFlow = +(inFlow * (0.65 + Math.random() * 0.1)).toFixed(1);
                const recovery = +((outFlow / inFlow) * 100).toFixed(1);
                const power = +(outFlow * 0.4 + Math.random() * 5).toFixed(1);
                const chemical = +(outFlow * 0.012 + Math.random() * 0.2).toFixed(2);
                const alarms = Math.random() > 0.85 ? Math.floor(Math.random() * 3) : 0;
                data.push({ timeStr: timeStrs[i], label: labels[i], inFlow, outFlow, recovery, power, chemical, alarms });
            }
            return { type, rows, timeLabel, data };
        }

        function renderReportTable(report) {
            const thead = document.getElementById('report-thead'), tbody = document.getElementById('report-tbody');
            if (!thead || !tbody) return;
            let totalIn = 0, totalOut = 0, totalPower = 0, totalChem = 0, totalAlarms = 0;
            report.data.forEach(d => { totalIn += d.inFlow; totalOut += d.outFlow; totalPower += d.power; totalChem += d.chemical; totalAlarms += d.alarms; });
            const avgRecovery = totalIn > 0 ? ((totalOut / totalIn) * 100).toFixed(1) : '0.0';

            thead.innerHTML = `<th style="position:sticky;top:0;background:#07152b;z-index:2">${report.timeLabel}</th><th style="position:sticky;top:0;background:#07152b;z-index:2">进水总量(m³)</th><th style="position:sticky;top:0;background:#07152b;z-index:2">产水总量(m³)</th><th style="position:sticky;top:0;background:#07152b;z-index:2">回收率(%)</th><th style="position:sticky;top:0;background:#07152b;z-index:2">耗电量(kWh)</th><th style="position:sticky;top:0;background:#07152b;z-index:2">药剂耗量(kg)</th><th style="position:sticky;top:0;background:#07152b;z-index:2">预警次数</th>`;

            let html = `<tr style="background:rgba(0,243,255,0.1);font-weight:bold;color:#00f3ff;">
                <td>📋 周期合计</td>
                <td>${totalIn.toFixed(1)}</td><td>${totalOut.toFixed(1)}</td><td>${avgRecovery}%</td>
                <td style="color:#ffeb3b">${totalPower.toFixed(1)}</td><td>${totalChem.toFixed(2)}</td>
                <td style="color:${totalAlarms>0?'#ff4d4f':'#00fa9a'}">${totalAlarms}</td></tr>`;
            report.data.forEach(d => {
                html += `<tr><td>${d.timeStr}</td><td>${d.inFlow.toFixed(1)}</td><td style="color:#00f3ff;font-weight:bold">${d.outFlow.toFixed(1)}</td><td>${d.recovery}%</td><td style="color:#ffeb3b">${d.power.toFixed(1)}</td><td>${d.chemical.toFixed(2)}</td><td style="color:${d.alarms>0?'#ff4d4f':'#00fa9a'}">${d.alarms}</td></tr>`;
            });
            tbody.innerHTML = html;

            // Save totals for summary
            report._totals = { totalIn: totalIn.toFixed(1), totalOut: totalOut.toFixed(1), avgRecovery, totalPower: totalPower.toFixed(1), totalChem: totalChem.toFixed(2), totalAlarms };
        }

        function renderReportCharts(report) {
            Object.values(reportChartInstances).forEach(c => c.dispose());
            reportChartInstances = {};
            const dom1 = document.getElementById('report-chart-1'), dom2 = document.getElementById('report-chart-2');
            if (!dom1 || !dom2) return;

            // 默认: 日报/月报/季报左右分栏(3:1)，周报/年报右栏隐藏
            if (report.type === 'weekly' || report.type === 'annual') {
                dom1.style.flex = '1'; dom2.style.display = 'none';
            } else {
                dom1.style.flex = '3'; dom2.style.flex = '1'; dom2.style.display = 'block';
            }

            const labels = report.data.map(d => d.label);
            const inData = report.data.map(d => d.inFlow);
            const outData = report.data.map(d => d.outFlow);
            const recData = report.data.map(d => d.recovery);
            const powData = report.data.map(d => d.power);
            const chemData = report.data.map(d => d.chemical);

            const c1 = echarts.init(dom1); reportChartInstances['c1'] = c1;
            const baseGrid = { left: '12%', right: '5%', bottom: '14%', top: '14%' };
            const legendCenter = { left: 'center', textStyle: { color: '#fff', fontSize: 7 }, itemWidth: 10, itemHeight: 8, top: 1 };
            const xStyle = { color: '#8898aa', fontSize: 7 };
            const yStyle = { color: '#8898aa', fontSize: 7 };
            const spl = { lineStyle: { color: 'rgba(255,255,255,0.06)' } };

            switch (report.type) {
                case 'daily': {
                    c1.setOption({
                        tooltip: { trigger: 'axis' },
                        legend: Object.assign({ data: ['进水','产水','回收率','耗电'] }, legendCenter),
                        grid: { left: '10%', right: '10%', bottom: '14%', top: '14%' },
                        xAxis: { type: 'category', data: labels, axisLabel: { color: '#8898aa', fontSize: 7, interval: 3 }, name: '(小时)', nameTextStyle: { color: '#8898aa', fontSize: 7 }, nameLocation: 'center', nameGap: 20 },
                        yAxis: [
                            { type: 'value', name: '水量 m³', nameTextStyle: { color: '#8898aa', fontSize: 7 }, axisLabel: yStyle, splitLine: spl },
                            { type: 'value', name: '% / kWh', nameTextStyle: { color: '#8898aa', fontSize: 7 }, axisLabel: yStyle, splitLine: { show: false } }
                        ],
                        series: [
                            { name: '进水', type: 'bar', barWidth: '45%', data: inData.map(function(v){return +v.toFixed(0)}), itemStyle: { color: '#005f99' } },
                            { name: '产水', type: 'bar', barWidth: '45%', data: outData.map(function(v){return +v.toFixed(0)}), itemStyle: { color: '#00f3ff' } },
                            { name: '回收率', type: 'line', yAxisIndex: 1, data: recData, smooth: true, itemStyle: { color: '#ffeb3b' }, symbol: 'none', lineStyle: { width: 2 } },
                            { name: '耗电', type: 'line', yAxisIndex: 1, data: powData, smooth: true, itemStyle: { color: '#ff9800' }, symbol: 'none', lineStyle: { width: 2 } }
                        ]
                    });
                    var c2 = echarts.init(dom2); reportChartInstances['c2'] = c2;
                    c2.setOption({
                        title: { text: '成本占比', left: 'center', top: 3, textStyle: { color: '#fff', fontSize: 9 } },
                        tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
                        legend: { bottom: 2, textStyle: { color: '#fff', fontSize: 7 }, itemWidth: 8, itemHeight: 8 },
                        series: [{
                            type: 'pie', radius: ['38%', '55%'], center: ['50%', '45%'],
                            label: { fontSize: 7, color: '#fff', formatter: '{b}\n{d}%', lineHeight: 10 },
                            labelLine: { length: 8, length2: 6 },
                            data: [
                                { value: +report._totals.totalPower, name: '电费', itemStyle: { color: '#ffeb3b' } },
                                { value: +report._totals.totalChem, name: '药剂费', itemStyle: { color: '#9c27b0' } },
                                { value: +(report._totals.totalOut * 0.02).toFixed(1), name: '人工运维', itemStyle: { color: '#00fa9a' } }
                            ]
                        }]
                    });
                    break;
                }
                case 'weekly': {
                    var weekLabels = ['周一','周二','周三','周四','周五','周六','周日'];
                    var boxData = [];
                    for (var bi = 0; bi < report.data.length; bi++) {
                        var r = report.data[bi].recovery;
                        boxData.push([Math.max(60, r - 4), r - 2, r, r + 2, Math.min(80, r + 4)]);
                    }
                    c1.setOption({
                        tooltip: { trigger: 'axis' },
                        legend: Object.assign({ data: ['进水','产水','回收率波动'] }, legendCenter),
                        grid: { left: '10%', right: '10%', bottom: '12%', top: '14%' },
                        xAxis: { type: 'category', data: weekLabels, axisLabel: xStyle },
                        yAxis: [
                            { type: 'value', name: '水量 m³', nameTextStyle: { color: '#8898aa', fontSize: 7 }, axisLabel: yStyle, splitLine: spl },
                            { type: 'value', name: '回收率 %', nameTextStyle: { color: '#8898aa', fontSize: 7 }, axisLabel: yStyle, splitLine: { show: false }, min: 55, max: 85 }
                        ],
                        series: [
                            { name: '进水', type: 'bar', barWidth: '28%', data: inData.map(function(v){return +v.toFixed(0)}), itemStyle: { color: '#005f99' }, barGap: '12%' },
                            { name: '产水', type: 'bar', barWidth: '28%', data: outData.map(function(v){return +v.toFixed(0)}), itemStyle: { color: '#00f3ff' } },
                            { name: '回收率波动', type: 'boxplot', yAxisIndex: 1, data: boxData, itemStyle: { color: '#ffeb3b', borderColor: '#ffeb3b', borderWidth: 1.5 }, boxWidth: [8, 12] }
                        ]
                    });
                    break;
                }
                case 'monthly': {
                    c1.setOption({
                        tooltip: { trigger: 'axis' },
                        grid: { left: '10%', right: '8%', bottom: '14%', top: '10%' },
                        xAxis: { type: 'category', data: labels, boundaryGap: false, axisLabel: { color: '#8898aa', fontSize: 7, interval: 4 }, name: '(日)', nameTextStyle: { color: '#8898aa', fontSize: 7 }, nameLocation: 'center', nameGap: 18 },
                        yAxis: { type: 'value', name: '产水量 m³', nameTextStyle: { color: '#8898aa', fontSize: 7 }, axisLabel: yStyle, splitLine: spl },
                        series: [{ name: '日产水量', type: 'line', smooth: true, data: outData.map(function(v){return +v.toFixed(0)}), itemStyle: { color: '#00f3ff' }, areaStyle: { color: 'rgba(0,243,255,0.25)' }, symbol: 'none', lineStyle: { width: 1.5 } }]
                    });
                    var c2 = echarts.init(dom2); reportChartInstances['c2'] = c2;
                    c2.setOption({
                        title: { text: '运营成本', left: 'center', top: 3, textStyle: { color: '#fff', fontSize: 9 } },
                        tooltip: { trigger: 'item' },
                        legend: { bottom: 2, textStyle: { color: '#fff', fontSize: 7 }, itemWidth: 8, itemHeight: 8 },
                        series: [{
                            type: 'pie', radius: ['38%', '55%'], center: ['50%', '45%'],
                            label: { fontSize: 7, color: '#fff', formatter: '{b}\n{d}%', lineHeight: 10 },
                            labelLine: { length: 8, length2: 6 },
                            data: [
                                { value: +report._totals.totalPower, name: '电费', itemStyle: { color: '#ffeb3b' } },
                                { value: +report._totals.totalChem, name: '药剂费', itemStyle: { color: '#9c27b0' } },
                                { value: +(report._totals.totalOut * 0.03).toFixed(1), name: '人工运维', itemStyle: { color: '#00fa9a' } }
                            ]
                        }]
                    });
                    break;
                }
                case 'quarterly': {
                    var qLabels = ['第1个月', '第2个月', '第3个月'];
                    c1.setOption({
                        tooltip: { trigger: 'axis' },
                        legend: Object.assign({ data: ['进水','产水','能耗'] }, legendCenter),
                        grid: { left: '10%', right: '8%', bottom: '14%', top: '14%' },
                        xAxis: { type: 'category', data: qLabels, axisLabel: xStyle },
                        yAxis: { type: 'value', name: '数量', nameTextStyle: { color: '#8898aa', fontSize: 7 }, axisLabel: yStyle, splitLine: spl },
                        series: [
                            { name: '进水', type: 'bar', barWidth: '22%', data: inData.map(function(v){return +v.toFixed(0)}), itemStyle: { color: '#005f99' }, barGap: '12%' },
                            { name: '产水', type: 'bar', barWidth: '22%', data: outData.map(function(v){return +v.toFixed(0)}), itemStyle: { color: '#00f3ff' } },
                            { name: '能耗', type: 'bar', barWidth: '22%', data: powData.map(function(v){return +v.toFixed(0)}), itemStyle: { color: '#ffeb3b' } }
                        ]
                    });
                    var c2 = echarts.init(dom2); reportChartInstances['c2'] = c2;
                    c2.setOption({
                        title: { text: '水量损耗', left: 'center', top: 3, textStyle: { color: '#fff', fontSize: 9 } },
                        tooltip: { trigger: 'item', formatter: '{b}: {c} m³' },
                        series: [{
                            type: 'funnel', left: '12%', right: '12%', top: 22, bottom: 22, width: '66%',
                            min: 0, max: Math.max.apply(null, inData.map(function(v){return +v.toFixed(0)})), gap: 4,
                            label: { show: true, position: 'right', fontSize: 7, color: '#fff', formatter: '{b}\n{c} m³', lineHeight: 10 },
                            labelLine: { length: 12, lineStyle: { width: 1 } },
                            data: [
                                { value: +report._totals.totalIn, name: '原水进水', itemStyle: { color: '#005f99' } },
                                { value: +(report._totals.totalIn * 0.9).toFixed(0), name: 'UF产水', itemStyle: { color: '#00f3ff' } },
                                { value: +report._totals.totalOut, name: 'RO产水', itemStyle: { color: '#00fa9a' } }
                            ]
                        }]
                    });
                    break;
                }
                case 'annual': {
                    var annualLabels = [];
                    for (var ai = 1; ai <= 12; ai++) annualLabels.push(ai + '月');
                    c1.setOption({
                        tooltip: { trigger: 'axis' },
                        legend: Object.assign({ data: ['回收率','耗电','药剂'] }, legendCenter),
                        grid: { left: '10%', right: '10%', bottom: '12%', top: '14%' },
                        xAxis: { type: 'category', data: annualLabels, axisLabel: { color: '#8898aa', fontSize: 7, interval: 1 } },
                        yAxis: [
                            { type: 'value', name: '回收率 %', nameTextStyle: { color: '#8898aa', fontSize: 7 }, axisLabel: yStyle, min: 55, max: 80, splitLine: spl },
                            { type: 'value', name: '消耗量', nameTextStyle: { color: '#8898aa', fontSize: 7 }, axisLabel: yStyle, splitLine: { show: false } }
                        ],
                        series: [
                            { name: '回收率', type: 'line', smooth: true, data: recData, itemStyle: { color: '#00f3ff' }, areaStyle: { color: 'rgba(0,243,255,0.2)' }, symbol: 'circle', symbolSize: 3, lineStyle: { width: 2 } },
                            { name: '耗电', type: 'bar', yAxisIndex: 1, stack: 'sum', barWidth: '45%', data: powData.map(function(v){return +v.toFixed(0)}), itemStyle: { color: '#ffeb3b' }, barGap: '15%' },
                            { name: '药剂', type: 'bar', yAxisIndex: 1, stack: 'sum', barWidth: '45%', data: chemData.map(function(v){return +v.toFixed(1)}), itemStyle: { color: '#9c27b0' } }
                        ]
                    });
                    dom2.style.display = 'none';
                    break;
                }
            }
        }
        function generateSummaryText(report) {
            const t = report._totals;
            const typeLabel = { daily: '当日', weekly: '本周', monthly: '本月', quarterly: '本季度', annual: '本年度' };
            const period = typeLabel[report.type] || '当期';
            const avgRecoveryNum = parseFloat(t.avgRecovery);
            const recoveryEval = avgRecoveryNum >= 68 ? '稳定达标，处于优良运行区间' : avgRecoveryNum >= 60 ? '基本正常，接近额定回收率下限' : '偏低，需排查膜性能衰减或预处理异常';
            const alarmEval = t.totalAlarms === 0 ? '期间系统运行平稳，未触发任何预警事件。' : `期间共触发 ${t.totalAlarms} 次预警事件，主要集中于水质波动时段，均已按预案完成闭环处置。`;
            const alarmTimeHint = t.totalAlarms > 0 ? '预警主要集中在高负荷运行时段，建议优化排产计划以降低瞬时冲击负荷。' : '';
            const optAdvice = avgRecoveryNum >= 68
                ? '建议继续保持当前工艺参数设定，定期开展预防性化学清洗，维持膜组件最佳性能状态。'
                : '建议安排一次超滤/反渗透膜性能评估，结合在线SDI检测数据判断是否需要调整预处理药剂投加量或提高反洗频率。';

            return `① ${period}产能汇总：总进水 ${t.totalIn} m³，总产水 ${t.totalOut} m³，平均回收率 ${t.avgRecovery}%，${recoveryEval}。
② 能耗与药耗：综合耗电量 ${t.totalPower} kWh，药剂总耗量 ${t.totalChem} kg。单位产水能耗约 ${(t.totalPower / t.totalOut).toFixed(2)} kWh/m³，药剂单耗约 ${(t.totalChem / t.totalOut * 1000).toFixed(1)} g/m³。电耗与药剂指标处于预算可控范围内。
③ 预警事件：${alarmEval}${alarmTimeHint}
④ 优化建议：${optAdvice}`;
        }

        window.generateReport = function() {
            reportDataCache = buildReportData();
            renderReportTable(reportDataCache);
            renderReportCharts(reportDataCache);
            const summary = generateSummaryText(reportDataCache);
            document.getElementById('report-summary-text').innerText = summary;
        };

        // ═══ 9. 设备运行日志 ═══
        function renderLogs() {
            const tbody = document.getElementById('table-body');
            const nodes = ['1# 预处理多介质','UF 超滤膜组 (A段)','UF 超滤膜组 (B段)','RO 反渗透高压泵','RO 膜组件 (1段)'];
            let html = ''; const now = new Date();
            for (let i = 0; i < 24; i++) {
                const logTime = new Date(now.getTime() - i*5*60000);
                const timeText = `${String(logTime.getHours()).padStart(2,'0')}:${String(logTime.getMinutes()).padStart(2,'0')}:00`;
                const node = nodes[Math.floor(Math.random()*nodes.length)];
                let pressure = (0.15+Math.random()*1.2).toFixed(2), cond = (12+Math.random()*5).toFixed(1);
                const isWarn = Math.random()>0.9;
                if (isWarn) pressure = (1.5+Math.random()*0.3).toFixed(2);
                html += `<tr><td>${timeText}</td><td>${node}</td><td style="color:${isWarn?'#ff4d4f':'#b0c4de'};font-weight:bold">${pressure}</td><td>${cond}</td><td><span class="status-badge ${isWarn?'status-warn':'status-normal'}">${isWarn?'预警异常':'正常运行'}</span></td></tr>`;
            }
            tbody.innerHTML = html;
        }

        window.onload = () => {
            generateTimeLabels();
            initBox1();
            ['box2','box3','box4','box5','box6','box7','box8'].forEach((id, i) => initDynamicBox(id, selectedMetrics[i]));
            renderLogs();
            generateReport();
            applyExportPerms();
        };

        window.addEventListener('resize', () => {
            Object.values(chartInstances).forEach(c => c.resize());
            Object.values(aiChartInstances).forEach(c => c.resize());
            Object.values(reportChartInstances).forEach(c => c.resize());
        });
    </script>
</body>
</html>
